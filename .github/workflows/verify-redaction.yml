name: Verify Redaction

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify Sarah Kellen Redaction Width
      run: |
        python -c "
        import sys, os
        sys.path.insert(0, os.getcwd())
        from guesser_core.logic.ProcessRedactions import process_pdf
        
        pdf_path = 'assets/pdfs/times/efta00018586.pdf'
        if not os.path.exists(pdf_path):
            print(f'ERROR: Test PDF not found at {pdf_path}')
            sys.exit(1)
            
        with open(pdf_path, 'rb') as f:
            pdf_bytes = f.read()
            
        result = process_pdf(pdf_bytes)
        
        # Look for redactions on page 8 (which is page index 7, but the process_pdf might output page=8)
        # We're looking for the 'Sarah Kellen' box. The expected width is 120.79px
        # with a tolerance of 0.2px (so roughly between 120.59 and 120.99)
        # Based on the ground-truth, it should be at x ≈ 233.16, width ≈ 120.76
        
        target_width = 120.79
        tolerance = 0.2
        
        found_box = False
        for r in result.get('redactions', []):
            if r['page'] == 8 and 230 <= r['x'] <= 236: # Sarah Kellen box on page 8
                found_box = True
                actual_width = r['width']
                print(f'Found target box at x={r[\"x\"]:.2f}. Width: {actual_width:.2f}px')
                
                diff = abs(actual_width - target_width)
                if diff > tolerance:
                    print(f'ERROR: Width {actual_width:.2f} deviates from expected {target_width} by {diff:.2f}px (limit is {tolerance}px)')
                    sys.exit(1)
                else:
                    print(f'SUCCESS: Width {actual_width:.2f} is within {tolerance}px of {target_width}px')
                    
        if not found_box:
            print('ERROR: Could not find the target redaction box on page 8')
            sys.exit(1)
        "
